# Ports are published on 127.0.0.1 only, so other machines on the network cannot reach the dev services.
services:
    nginx:
        image: nginx:1.28-alpine
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    php:
        image: laravel-react-ai-training-php
        build: docker/php
        user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
        volumes:
            - .:/var/www/html
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/99-local.ini:ro
        environment:
            # Inertia SSR in Vite dev mode: reach the node service, not the localhost URL in public/hot
            INERTIA_SSR_HOT_URL: http://node:${VITE_PORT:-5173}
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
        ports:
            - '127.0.0.1:${MYSQL_EXPOSE_PORT:-33060}:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s

    mailpit:
        image: axllent/mailpit:v1.31
        ports:
            - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'

    node:
        image: laravel-react-ai-training-php
        user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
        ports:
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        volumes:
            - .:/var/www/html
        environment:
            # laravel-vite-plugin: listen on 0.0.0.0 but write http://localhost:VITE_PORT to public/hot
            LARAVEL_SAIL: '1'
            VITE_PORT: ${VITE_PORT:-5173}
            # Allow SSR requests from the php container (Vite rejects unknown Host headers)
            __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: node
        # Remove public/hot on stop so Laravel falls back to the built assets
        command: sh -c 'trap "rm -f public/hot" EXIT; trap exit TERM INT; npm run dev & wait'
        # The php-fpm base image sets STOPSIGNAL SIGQUIT, which would skip the trap above
        stop_signal: SIGTERM
        profiles: ['dev']

volumes:
    mysql_data:

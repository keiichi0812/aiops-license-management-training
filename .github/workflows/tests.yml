name: tests

# Run only for pull requests that are ready for review, to save GitHub Actions minutes
# in every repository created from this template (draft pull requests are skipped)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel the previous run when new commits are pushed to the same pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # .env.example targets the Docker MySQL service; CI has no database server
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
